# Builds the app for every platform so each one is known to compile.
# - On every push to main: builds are kept as downloadable workflow artifacts.
# - On a version tag (for example v2.0.0): the builds are also attached to a
#   GitHub Release, where anyone can download them.
#
# These are test builds. The Android APK is signed with a debug key and the
# macOS app is ad-hoc signed, so they are fine for trying the app but not for
# the Play Store or App Store. iOS is compiled without signing as a check only.
name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CREATE: flutter create . --project-name aquaaware --org org.aquaaware

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and configure
        run: |
          $FLUTTER_CREATE --platforms android
          dart run tool/configure_platforms.dart
      - run: flutter pub get
      - name: Build
        run: flutter build apk --release
      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk AquaAware-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AquaAware-android
          path: AquaAware-android.apk

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and configure
        run: |
          $FLUTTER_CREATE --platforms linux
          dart run tool/configure_platforms.dart
      - run: flutter pub get
      - name: Build
        run: flutter build linux --release
      - name: Package
        run: tar -czf AquaAware-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: AquaAware-linux
          path: AquaAware-linux-x64.tar.gz

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and configure
        shell: pwsh
        run: |
          flutter create . --project-name aquaaware --org org.aquaaware --platforms windows
          dart run tool/configure_platforms.dart
      - run: flutter pub get
      - name: Build
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath AquaAware-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AquaAware-windows
          path: AquaAware-windows-x64.zip

  apple:
    name: macOS app and iOS compile check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and configure
        run: |
          $FLUTTER_CREATE --platforms ios,macos
          dart run tool/configure_platforms.dart
      - run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release
      - name: Build iOS (no signing, compile check only)
        run: flutter build ios --release --no-codesign
      - name: Package macOS
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/aquaaware.app AquaAware-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AquaAware-macos
          path: AquaAware-macos.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "AquaAware $TAG" \
            --notes "Test builds of AquaAware $TAG for Android, Windows, macOS and Linux. The web version runs at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ — see the README for demo accounts. Android: allow installing from unknown sources. macOS: right-click the app and choose Open the first time."
