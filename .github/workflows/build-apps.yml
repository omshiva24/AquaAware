# Builds the app for every platform so each one is known to compile.
# - On every push to main: builds are kept as downloadable workflow artifacts.
# - On a version tag (for example v2.0.0): the builds are also attached to a
#   GitHub Release, where anyone can download them.
#
# These are test builds. The Android APK is signed with a debug key and the
# macOS app is ad-hoc signed, so they are fine for trying the app but not for
# the Play Store or App Store. iOS is compiled without signing as a check only.
name: Build apps

on:
  push:
    branches: [main]
    tags: ['v*']
  # Publishing a release on GitHub (Releases → Draft a new release) also
  # builds every platform and attaches the files to it.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CREATE: flutter create . --project-name aquaaware --org org.aquaaware

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and configure
        run: |
          $FLUTTER_CREATE --platforms android
          dart run tool/configure_platforms.dart
      - run: flutter pub get
      - name: Build
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a build-output.txt
      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/annotate.py errors build-output.txt "Android build"
      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk AquaAware-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AquaAware-android
          path: AquaAware-android.apk

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and configure
        run: |
          $FLUTTER_CREATE --platforms linux
          dart run tool/configure_platforms.dart
      - run: flutter pub get
      - name: Build
        run: |
          set -o pipefail
          flutter build linux --release 2>&1 | tee -a build-output.txt
      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/annotate.py errors build-output.txt "Linux build"
      - name: Package
        run: tar -czf AquaAware-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: AquaAware-linux
          path: AquaAware-linux-x64.tar.gz

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and configure
        shell: pwsh
        run: |
          flutter create . --project-name aquaaware --org org.aquaaware --platforms windows
          dart run tool/configure_platforms.dart
      - run: flutter pub get
      - name: Build
        shell: pwsh
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath build-output.txt -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Report build errors
        if: failure()
        shell: pwsh
        run: python .github/scripts/annotate.py errors build-output.txt "Windows build"
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath AquaAware-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AquaAware-windows
          path: AquaAware-windows-x64.zip

  apple:
    name: macOS app and iOS compile check
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create and configure
        run: |
          $FLUTTER_CREATE --platforms ios,macos
          dart run tool/configure_platforms.dart
      - run: flutter pub get
      - name: Build macOS
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee -a build-output.txt
      - name: Build iOS (no signing, compile check only)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee -a build-output.txt
      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/annotate.py errors build-output.txt "Apple build"
      - name: Package macOS
        run: ditto -c -k --keepParent build/macos/Build/Products/Release/aquaaware.app AquaAware-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AquaAware-macos
          path: AquaAware-macos.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux, windows, apple]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release, or add the files to it if it exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          NOTES: >-
            Test builds of AquaAware for Android, Windows, macOS and Linux.
            The web version runs at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
            and the README lists the demo accounts.
            Android: allow installing from unknown sources.
            macOS: right-click the app and choose Open the first time.
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "AquaAware $TAG" --notes "$NOTES"
          fi
