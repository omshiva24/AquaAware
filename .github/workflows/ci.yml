# Checks every push and pull request: the Flutter app (analyzer + all tests)
# and the Node.js server (its own test suite).
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App · analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create platform folders and configure them
        run: |
          flutter create . --project-name aquaaware --org org.aquaaware \
            --platforms android,ios,web,windows,macos,linux
          dart run tool/configure_platforms.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze-output.txt

      - name: Report analyzer problems
        if: failure()
        run: python3 .github/scripts/annotate.py errors analyze-output.txt "Analyzer"

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test-output.txt

      - name: Report test failures
        if: failure()
        run: python3 .github/scripts/annotate.py tests test-output.txt "Test failure"

  server:
    name: Server · test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test
