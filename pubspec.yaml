name: aquaaware
description: >-
  AquaAware — water and waste awareness for Pondicherry schools. Students learn,
  earn points and claim rewards; educators, NGOs and managers coordinate action.
publish_to: none
version: 2.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  # Navigation with role-based route guards.
  go_router: ^17.5.0

  # Security: key storage in Keychain / Keystore / DPAPI / libsecret / WebCrypto,
  # AES-256-GCM + HMAC-SHA256 + PBKDF2 from a vetted library.
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  cryptography: ^2.9.0
  local_auth: ^3.0.2

  # QR codes: render signed tokens, scan them on Android / iOS / macOS / web.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2

  # Maps that work on every platform (OpenStreetMap tiles).
  flutter_map: ^8.3.2
  latlong2: ">=0.9.1 <0.11.0"
  geolocator: ^14.1.1

  # Device context (battery, network) for adaptive behaviour.
  battery_plus: ^7.0.0
  connectivity_plus: ^7.0.0

  # Accessibility: read lessons aloud.
  flutter_tts: ^4.2.5

  # Files, links and sync.
  file_picker: ^13.1.0
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    # Atkinson Hyperlegible Next — designed by the Braille Institute for
    # readers with low vision. SIL Open Font License (assets/fonts/OFL.txt).
    - family: AtkinsonNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
          weight: 400
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Medium.ttf
          weight: 500
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
        - asset: assets/fonts/AtkinsonHyperlegibleNext-ExtraBold.ttf
          weight: 800
